peft_config: null
dur_range: [2.0, 2.0]
embd_dim: 256
sample_rate: 16000

spk_model: !new:src.vpr.feature.spk_model.Audio2Vec_based_Adapter
    model_name: 'facebook/w2v-bert-2.0'
    frozen_encoder: false
    bnb_config: null
    peft_config: !ref <peft_config>
    encoder_config: 'config_prune_tea.json'
    n_mfa_layers: -1
    pooling_layer: 'ASP' 
    embd_dim: !ref <embd_dim> 
    adapter_dim: 128
    dropout: 0.0


modules: 
    spk_model: !ref <spk_model>